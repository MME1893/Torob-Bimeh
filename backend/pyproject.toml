[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "torob-bimeh-backend"
version = "0.1.0"
description = "Provider adapters and experimental quote API for Torob Bimeh"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=3.19.2",
  "python-dotenv>=1,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/torob_bimeh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
