name: Verify insurance search

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv
      - name: Run backend tests
        working-directory: backend
        run: |
          uv sync --frozen --extra test
          uv run pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Check provider laboratories
        working-directory: frontend
        run: |
          node tests/azki_lab_smoke.cjs
          node tests/sabim_lab_smoke.cjs
          node tests/bimebazar_lab_smoke.cjs
          node tests/bimeh_lab_smoke.cjs
